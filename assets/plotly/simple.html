<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.plot.ly/plotly-2.16.1.min.js"></script>
    <style>
      html,
      body,
      #plot {
        width: 100%;
        height: 100%;
        min-height: 420px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="plot" aria-label="Interactive Plotly bar chart"></div>
    <script>
      Plotly.newPlot(
        "plot",
        [
          {
            x: ["Tabs", "ECharts", "Pseudocode", "Images"],
            y: [12, 19, 9, 15],
            type: "bar",
            marker: { color: "#0076df" },
          },
        ],
        {
          title: "Interactive Plotly example",
          margin: { t: 56, r: 24, b: 48, l: 48 },
          paper_bgcolor: "transparent",
          plot_bgcolor: "transparent",
        },
        { responsive: true, displaylogo: false }
      );
    </script>
  </body>
</html>
